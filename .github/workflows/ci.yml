name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Build
        run: make
      - name: Test
        run: make test
      - name: Rebuild release manifest
        run: make release-manifest
      - name: Assert release manifest is deterministic
        run: git diff --exit-code -- release-manifest.sha256
      - name: Verify release manifest
        run: make verify-release-manifest
      - name: Build current source bundle
        if: github.ref == 'refs/heads/main'
        run: make paper-bundle
      - name: Download published release artifacts
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p build/published-release
          curl -fL --retry 4 --retry-all-errors \
            https://github.com/ruturajr-raval/ternary-covering-code-6-2/releases/download/v0.1.0/ternary-covering-code-6-2-paper.pdf \
            -o build/published-release/ternary-covering-code-6-2-paper.pdf
          curl -fL --retry 4 --retry-all-errors \
            https://github.com/ruturajr-raval/ternary-covering-code-6-2/releases/download/v0.1.0/ternary-covering-code-6-2-source.tar.gz \
            -o build/published-release/ternary-covering-code-6-2-source.tar.gz
          curl -fL --retry 4 --retry-all-errors \
            https://zenodo.org/api/records/22510342/files/ruturajr-raval/ternary-covering-code-6-2-v0.1.0.zip/content \
            -o build/published-release/ternary-covering-code-6-2-v0.1.0.zip
      - name: Verify published release artifacts
        if: github.ref == 'refs/heads/main'
        run: |
          python3 tools/verify_release_assets.py \
            --release-pdf \
              build/published-release/ternary-covering-code-6-2-paper.pdf \
            --release-source \
              build/published-release/ternary-covering-code-6-2-source.tar.gz \
            --zenodo-archive \
              build/published-release/ternary-covering-code-6-2-v0.1.0.zip

  cp-sat-model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: tools/ortools-ci-requirements.lock
      - name: Install pinned OR-Tools environment
        run: PYTHON=python tools/bootstrap_ortools.sh
      - name: Test CP-SAT geometry and model
        run: make test-cp-sat
      - name: Run CP-SAT solver smoke test
        run: |
          set +e
          .tools/ortools-venv/bin/python tools/cp_sat_search.py \
            --weight 4 \
            --seconds 30 \
            --workers 1 \
            --result-json research-results/ci-direct-result.json
          status=$?
          set -e
          test "$status" -eq 20
          grep -q '"status": "INFEASIBLE"' \
            research-results/ci-direct-result.json
      - name: Run CP-SAT campaign smoke test
        run: |
          set +e
          .tools/ortools-venv/bin/python tools/cp_sat_orbit_campaign.py \
            --weight 4 \
            --orbit 28 \
            --seconds 30 \
            --jobs 1 \
            --workers-per-job 1 \
            --output research-results/ci-campaign
          status=$?
          set -e
          test "$status" -eq 3
          grep -q '"full_manifest_covered": false' \
            research-results/ci-campaign/summary.json

  paper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra lmodern
      - name: Build technical report
        run: make paper-build
      - name: Build deterministic source bundle
        run: make paper-bundle
      - name: Verify source release asset
        run: make verify-release-assets
      - name: Inspect source bundle
        run: tar -tzf dist/paper/ternary-covering-code-6-2-source.tar.gz
      - name: Compile from release source bundle
        run: |
          mkdir -p build/source-replay build/source-replay-output
          tar -xzf \
            dist/paper/ternary-covering-code-6-2-source.tar.gz \
            -C build/source-replay
          cd build/source-replay
          latexmk -pdf -interaction=nonstopmode -halt-on-error \
            -file-line-error \
            -output-directory=../source-replay-output \
            paper/main.tex
      - name: Upload report assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ternary-covering-code-6-2-report
          path: |
            build/paper/main.pdf
            dist/paper/ternary-covering-code-6-2-source.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Assert no tracked files changed
        if: always()
        run: git diff --exit-code
