name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Build
        run: make
      - name: Test
        run: make test
      - name: Rebuild release manifest
        run: make release-manifest
      - name: Assert release manifest is deterministic
        run: git diff --exit-code -- release-manifest.sha256
      - name: Verify release manifest
        run: make verify-release-manifest

  cp-sat-model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: tools/ortools-ci-requirements.lock
      - name: Install pinned OR-Tools environment
        run: PYTHON=python tools/bootstrap_ortools.sh
      - name: Test CP-SAT geometry and model
        run: make test-cp-sat
      - name: Run CP-SAT solver smoke test
        run: |
          set +e
          .tools/ortools-venv/bin/python tools/cp_sat_search.py \
            --weight 4 \
            --seconds 30 \
            --workers 1 \
            --result-json research-results/ci-direct-result.json
          status=$?
          set -e
          test "$status" -eq 20
          grep -q '"status": "INFEASIBLE"' \
            research-results/ci-direct-result.json
      - name: Run CP-SAT campaign smoke test
        run: |
          set +e
          .tools/ortools-venv/bin/python tools/cp_sat_orbit_campaign.py \
            --weight 4 \
            --orbit 28 \
            --seconds 30 \
            --jobs 1 \
            --workers-per-job 1 \
            --output research-results/ci-campaign
          status=$?
          set -e
          test "$status" -eq 3
          grep -q '"full_manifest_covered": false' \
            research-results/ci-campaign/summary.json

  paper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Tectonic 0.17.0
        run: |
          mkdir -p build/tectonic
          curl -fL --retry 4 --retry-all-errors \
            https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz \
            -o build/tectonic/tectonic.tar.gz
          echo \
            "8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7  build/tectonic/tectonic.tar.gz" \
            | shasum -a 256 -c -
          tar -xzf build/tectonic/tectonic.tar.gz -C build/tectonic
      - name: Build paper-inclusive release assets
        run: TECTONIC=build/tectonic/tectonic make release-assets
      - name: Verify release assets and checksums
        run: |
          make release-checksums
          make verify-release-assets
      - name: Inspect source bundle
        run: tar -tzf dist/paper/ternary-covering-code-6-2-source.tar.gz
      - name: Compile from release source bundle
        run: |
          mkdir -p build/source-replay build/source-replay-output
          tar -xzf \
            dist/paper/ternary-covering-code-6-2-source.tar.gz \
            -C build/source-replay
          cd build/source-replay
          SOURCE_DATE_EPOCH=1788739200 \
            ../tectonic/tectonic -X compile paper/main.tex \
              --outdir ../source-replay-output --keep-logs
          cmp ../source-replay-output/main.pdf \
            ../../dist/release/ternary-covering-code-6-2-paper.pdf
      - name: Assert deterministic PDF and source bundle
        run: |
          cp dist/release/ternary-covering-code-6-2-paper.pdf \
            build/release-pdf-first.pdf
          cp dist/release/ternary-covering-code-6-2-source.tar.gz \
            build/release-source-first.tar.gz
          TECTONIC=build/tectonic/tectonic make release-assets
          cmp build/release-pdf-first.pdf \
            dist/release/ternary-covering-code-6-2-paper.pdf
          cmp build/release-source-first.tar.gz \
            dist/release/ternary-covering-code-6-2-source.tar.gz
      - name: Upload report assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ternary-covering-code-6-2-report
          path: |
            dist/release/ternary-covering-code-6-2-paper.pdf
            dist/release/ternary-covering-code-6-2-source.tar.gz
            dist/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Assert no tracked files changed
        if: always()
        run: git diff --exit-code
